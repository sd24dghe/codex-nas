name: Feature request
description: Propose an improvement or integration
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow and outcome rather than only the implementation.
        Large changes should be discussed here before a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web interface
        - API and model settings
        - Conversation management
        - Docker deployment
        - Shell menu
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help test this change.
        - label: I am willing to submit a pull request.
