<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fb7299">
  <title>NAS Codex - Mizuki & Ryo Theme</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: light dark;
      /* Mizuki Theme Variables (ACG & Glassmorphism) */
      --bg: transparent;
      --surface: rgba(255, 255, 255, 0.65);
      --surface-strong: rgba(255, 255, 255, 0.85);
      --surface-muted: rgba(255, 255, 255, 0.4);
      --glass-border: rgba(255, 255, 255, 0.6);
      --text: #4c4948;
      --secondary: #858585;
      --tertiary: #a1a1a6;
      --separator: rgba(255, 255, 255, 0.5);
      
      /* Sakura Pink / Mizuki Accent */
      --accent: #fb7299; 
      --accent-hover: #fa5a85;
      --accent-soft: rgba(251, 114, 153, 0.15);
      
      --success: #34c759;
      --warning: #ff9500;
      --danger: #ff3b30;
      --danger-soft: rgba(255, 59, 48, 0.15);
      
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --soft-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      
      --radius: 20px;
      --radius-small: 12px;
      
      --font: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: rgba(30, 30, 34, 0.55);
        --surface-strong: rgba(30, 30, 34, 0.85);
        --surface-muted: rgba(0, 0, 0, 0.3);
        --glass-border: rgba(255, 255, 255, 0.15);
        
        --text: #eeeeee;
        --secondary: #aaaaaa;
        --separator: rgba(255, 255, 255, 0.1);
        
        --accent: #ff7eb3;
        --accent-hover: #ff9cc3;
        --accent-soft: rgba(255, 126, 179, 0.2);
        
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        --soft-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
      }
    }

    * { box-sizing: border-box; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent-soft); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    body {
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font: 100%/1.6 var(--font);
      -webkit-font-smoothing: antialiased;
      
      background-image: var(--wallpaper-image, none);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      z-index: -1;
    }
    @media (prefers-color-scheme: dark) {
      body::before {
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(18px) saturate(130%);
        -webkit-backdrop-filter: blur(18px) saturate(130%);
      }
    }

    button, input, textarea, select { font: inherit; }
    button { border: 0; color: inherit; background: none; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; cursor: pointer; }

    .screen { min-height: 100dvh; }

    .login-screen {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-panel {
      width: min(100%, 420px);
      padding: 48px 36px 32px;
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      background: var(--surface-strong);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      animation: panel-in 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      text-align: center;
      position: relative;
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(24px) scale(0.95); }
    }

    /* Optional local avatar */
    @keyframes float {
      0%, 100% { transform: translateY(0px); box-shadow: 0 16px 40px rgba(36, 75, 126, 0.4); }
      50% { transform: translateY(-10px); box-shadow: 0 24px 48px rgba(36, 75, 126, 0.5); }
    }

    .brand-mark.avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.8);
      background: #eef2f5;
      box-shadow: 0 16px 40px rgba(36, 75, 126, 0.4);
      overflow: hidden;
      animation: float 4s ease-in-out infinite;
      position: relative;
      z-index: 10;
    }
    
    @media (prefers-color-scheme: dark) {
      .brand-mark.avatar {
        border: 4px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      }
    }

    .brand-mark.avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      z-index: 2;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .avatar-fallback {
      position: relative;
      z-index: 1;
      color: var(--accent);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.03em;
    }
    
    .brand-mark.avatar:hover img {
      transform: scale(1.1) rotate(3deg);
    }

    .login-panel h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.05);
    }

    .login-panel p {
      margin: 0 0 32px;
      color: var(--secondary);
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 24px;
      text-align: left;
    }
    .field label {
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
      padding-left: 6px;
    }

    input, textarea, select {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--separator);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      padding: 12px 18px;
      outline: none;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      font-size: 15px;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      background: var(--surface-strong);
      box-shadow: 0 0 0 4px var(--accent-soft);
      transform: translateY(-1px);
    }

    .button {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 16px;
      background: var(--surface-muted);
      padding: 12px 24px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .button:active { transform: scale(0.96); }

    .button.primary {
      background: linear-gradient(135deg, var(--accent), #ff9cc3);
      color: white;
      box-shadow: 0 6px 20px var(--accent-soft);
      border: none;
    }
    .button.primary:hover {
      background: linear-gradient(135deg, var(--accent-hover), #ffb3d2);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px var(--accent-soft);
    }

    .button.ghost {
      background: transparent;
      border: 1px solid var(--separator);
    }
    .button.ghost:hover { background: var(--surface-muted); }

    .button.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .button.danger:hover { background: color-mix(in srgb, var(--danger-soft) 80%, var(--danger)); }

    .button.wide { width: 100%; }
    .button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .error-text {
      min-height: 20px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 13px;
    }

    /* Elegant Powered By Footer */
    .power-by {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--separator);
      font-size: 12px;
      color: var(--secondary);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--mono);
    }
    .power-by b {
      color: var(--text);
      font-weight: 700;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }
    .power-by:hover b { opacity: 1; }
    .power-by span { opacity: 0.4; font-size: 10px; }

    /* App Layout */
    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100dvh;
      padding: 16px;
      gap: 16px;
      box-sizing: border-box;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      padding: 0 24px;
      border-radius: var(--radius);
      border: 1px solid var(--glass-border);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      z-index: 20;
    }

    .toolbar-title { display: flex; align-items: center; gap: 12px; }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 20%, transparent);
    }

    .title-stack strong { display: block; font-size: 17px; font-weight: 700; }
    .title-stack small { display: block; color: var(--secondary); font-size: 12px; }
    .toolbar-actions { display: flex; gap: 8px; }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--surface-muted);
      font-size: 18px;
      font-weight: bold;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .icon-button:hover { background: var(--separator); transform: scale(1.08); }
    .icon-button:active { transform: scale(0.9); }

    .api-short {
      font-size: 11px;
      letter-spacing: .02em;
    }

    .app-body {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 16px;
      min-height: 0;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 24px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--glass-border);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      overflow-y: auto;
    }

    .sidebar-section { display: grid; gap: 8px; }
    .section-label {
      padding: 0 12px;
      color: var(--secondary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .nav-button {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-small);
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .nav-button:hover { background: var(--surface-muted); transform: translateX(6px); }
    .nav-symbol { color: var(--accent); font-size: 18px; width: 20px; text-align: center; }

    .task-list { display: grid; gap: 6px; }
    .task-button {
      display: grid;
      gap: 4px;
      padding: 12px 16px;
      border-radius: var(--radius-small);
      border-left: 3px solid transparent;
      transition: all 0.3s ease;
    }
    .task-button:hover { background: var(--surface-muted); transform: translateX(6px); }
    .task-button.active {
      background: var(--accent-soft);
      border-left-color: var(--accent);
      border-radius: 4px var(--radius-small) var(--radius-small) 4px;
    }
    .task-button strong { font-size: 14px; font-weight: 600; }
    .task-button.active strong { color: var(--accent); }
    .task-button small { color: var(--secondary); font-size: 12px; }

    .workspace {
      display: grid;
      grid-template-rows: 1fr auto;
      border-radius: var(--radius);
      border: 1px solid var(--glass-border);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      overflow: hidden;
      min-width: 0;
    }

    .timeline-wrap {
      overflow-y: auto;
      padding: 32px;
      scroll-behavior: smooth;
    }
    .timeline { width: min(100%, 800px); margin: 0 auto; display: grid; gap: 24px; }

    .empty-state {
      text-align: center;
      margin-top: 15vh;
      animation: panel-in 600ms ease both;
    }
    .empty-state h2 { font-size: 32px; margin-bottom: 8px; color: var(--text); }
    .empty-state p { color: var(--secondary); }

    .event { animation: event-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    @keyframes event-in { from { opacity: 0; transform: translateY(12px); } }

    .message { max-width: 85%; font-size: 15px; line-height: 1.7; }
    .message.user {
      justify-self: end;
      background: linear-gradient(135deg, var(--accent), #ff9cc3);
      color: white;
      padding: 14px 20px;
      border-radius: 20px 20px 4px 20px;
      box-shadow: 0 4px 16px var(--accent-soft);
    }
    .message.assistant {
      justify-self: start;
      background: var(--surface-strong);
      border: 1px solid var(--glass-border);
      padding: 16px 20px;
      border-radius: 4px 20px 20px 20px;
      box-shadow: var(--soft-shadow);
      color: var(--text);
    }

    .rich-text p, .rich-text ul, .rich-text pre, .rich-text table { margin: 0 0 1em; }
    .rich-text h1, .rich-text h2, .rich-text h3 { margin: 1.2em 0 0.5em; }
    .rich-text code {
      background: var(--surface-muted);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.9em;
    }
    .rich-text pre {
      background: var(--surface-muted);
      padding: 16px;
      border-radius: 12px;
      overflow-x: auto;
      border: 1px solid var(--separator);
    }
    .rich-text pre code { background: transparent; padding: 0; }
    .rich-text blockquote {
      border-left: 4px solid var(--accent);
      padding: 8px 16px;
      background: var(--accent-soft);
      border-radius: 0 8px 8px 0;
      margin-left: 0;
    }
    .rich-text table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
    }
    .rich-text th, .rich-text td { border: 1px solid var(--separator); padding: 8px 12px; }
    .rich-text th { background: var(--surface-muted); }
    .rich-text .katex-display { overflow-x: auto; padding: 10px 0; }

    .status-pill {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--surface-strong);
      border: 1px solid var(--glass-border);
      font-size: 13px;
      color: var(--secondary);
    }
    .status-pill.thinking::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: breathe 1s infinite alternate ease-in-out;
    }
    @keyframes breathe {
      from { transform: scale(0.8); opacity: 0.5; }
      to { transform: scale(1.5); opacity: 1; box-shadow: 0 0 8px var(--accent); }
    }

    .tool-card {
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--surface-strong);
      overflow: hidden;
      margin: 8px 0;
    }
    .tool-card summary {
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tool-command { font-family: var(--mono); color: var(--accent); font-size: 13px; flex: 1; }
    .tool-meta { font-size: 12px; background: var(--surface-muted); padding: 4px 8px; border-radius: 12px; }
    .tool-output {
      padding: 16px; margin: 0;
      background: rgba(0,0,0,0.03);
      border-top: 1px solid var(--separator);
      font-family: var(--mono); font-size: 12px;
      max-height: 300px; overflow-y: auto;
    }

    .composer-wrap {
      padding: 24px 32px;
      background: var(--surface-strong);
      border-top: 1px solid var(--glass-border);
      backdrop-filter: blur(24px);
    }
    .composer {
      width: min(100%, 800px);
      margin: 0 auto;
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }
    .composer textarea {
      flex: 1;
      border-radius: 24px;
      padding: 16px 24px;
      background: var(--surface);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      max-height: 150px;
      resize: none;
      font-size: 15px;
    }
    .send-button {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #ff9cc3);
      color: white;
      font-size: 24px;
      font-weight: bold;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 16px var(--accent-soft);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      flex-shrink: 0;
    }
    .send-button:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 8px 24px var(--accent-soft); }
    .send-button:active { transform: scale(0.95); }

    /* Sheet / Dialogs */
    .sheet-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: grid; place-items: center;
      padding: 24px; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease; z-index: 100;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      width: min(100%, 640px); max-height: 85vh;
      display: flex; flex-direction: column;
      background: var(--surface-strong);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.2);
      transform: translateY(20px) scale(0.95);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .sheet-backdrop.open .sheet { transform: translateY(0) scale(1); }
    .sheet-header {
      padding: 24px 28px;
      border-bottom: 1px solid var(--separator);
      display: flex; justify-content: space-between; align-items: center;
    }
    .sheet-header h2 { margin: 0; font-size: 22px; }
    .sheet-content { padding: 28px; overflow-y: auto; }

    .history-list { display: grid; gap: 12px; }
    .history-row {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
      padding: 16px 20px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--separator);
      transition: all 0.3s ease;
    }
    .history-row:hover { border-color: var(--accent); box-shadow: var(--soft-shadow); transform: translateX(6px); }
    .history-main { flex: 1; min-width: 200px; }
    .history-title { font-weight: 650; margin-bottom: 6px; }
    .history-meta { font-size: 13px; color: var(--secondary); }
    .history-actions { display: flex; gap: 8px; }

    .chip {
      padding: 8px 14px; border-radius: 16px; background: var(--surface-muted);
      font-size: 13px; font-weight: 600; transition: all 0.2s;
    }
    .chip:hover { background: var(--separator); }
    .chip.active { background: var(--accent-soft); color: var(--accent); }
    .chip.danger { background: var(--danger-soft); color: var(--danger); }

    .toast {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--surface-strong); border: 1px solid var(--glass-border);
      padding: 12px 24px; border-radius: 30px; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 200;
      backdrop-filter: blur(20px); font-weight: 600;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .hidden { display: none !important; }
    .mobile-only { display: none; }

    /* Responsive */
    @media (max-width: 820px) {
      .app { padding: 12px; gap: 12px; }
      .app-body { display: block; }
      .sidebar {
        position: fixed; z-index: 50; top: 88px; bottom: 12px; left: 12px; width: 280px;
        transform: translateX(-120%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .sidebar.open { transform: translateX(0); }
      .workspace { height: calc(100dvh - 88px - 12px); }
      .mobile-only { display: block; }
      .message.user { max-width: 90%; }
      .composer-wrap { padding: 16px; }
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <section class="screen login-screen" id="loginScreen">
    <form class="login-panel" id="loginForm">
      
      <!-- Built-in Avatar handling -->
      <div class="brand-mark avatar">
        <span class="avatar-fallback">NAS</span>
        <img src="./avatar.jpg" alt="" onerror="this.hidden=true">
      </div>

      <h1>NAS Codex</h1>
      <p>私有云 Codex 控制台</p>
      
      <div class="field">
        <label for="password">访问密码</label>
        <input id="password" type="password" autocomplete="current-password" autofocus placeholder="••••••••">
      </div>
      <button class="button primary wide" type="submit" id="loginButton">进入控制台</button>
      <div class="error-text" id="loginError" role="alert"></div>

      <!-- Elegant Powered By Footer -->
      <div class="power-by">
        Powered by <b>Codex CLI</b> <span>&times;</span> <b>Node.js</b> <span>&times;</span> <b>Docker</b>
      </div>
    </form>
  </section>

  <!-- App Workspace -->
  <section class="app hidden" id="app">
    <header class="toolbar">
      <div class="toolbar-title">
        <button class="icon-button mobile-only" id="menuButton" aria-label="打开菜单">≡</button>
        <div class="status-dot" id="connectionDot"></div>
        <div class="title-stack">
          <strong id="toolbarTitle">NAS Codex</strong>
          <small id="toolbarSubtitle">准备就绪</small>
        </div>
      </div>
      <div class="toolbar-actions">
        <button class="icon-button api-short" id="apiButton" aria-label="API 设置">API</button>
        <button class="icon-button" id="languageButton" aria-label="语言设置">文</button>
        <button class="icon-button" id="logoutButton" aria-label="退出登录">↪</button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <section class="sidebar-section">
          <span class="section-label">控制台</span>
          <button class="nav-button" id="newTaskButton">
            <span class="nav-symbol">✦</span><span class="nav-label">新建任务</span>
          </button>
          <button class="nav-button" id="resumeButton">
            <span class="nav-symbol">↻</span><span class="nav-label">恢复最近</span>
          </button>
          <button class="nav-button" id="historyButton">
            <span class="nav-symbol">⌘</span><span class="nav-label">历史对话</span>
          </button>
          <button class="nav-button" id="favoritesButton">
            <span class="nav-symbol">★</span><span class="nav-label">收藏与置顶</span>
          </button>
        </section>
        <section class="sidebar-section">
          <span class="section-label">运行中</span>
          <div class="task-list" id="taskList"></div>
        </section>
      </aside>

      <main class="workspace">
        <div class="timeline-wrap" id="timelineWrap">
          <div class="timeline" id="timeline">
            <section class="empty-state">
              <h2>今天想让 Codex 做什么？</h2>
              <p>通过私有 API 启动任务，实时查看执行过程。</p>
            </section>
          </div>
        </div>
        <div class="composer-wrap">
          <form class="composer" id="composer">
            <textarea id="promptInput" rows="1" placeholder="输入指令，开始对话..."></textarea>
            <button class="send-button" type="submit" id="sendButton" aria-label="发送">↑</button>
          </form>
        </div>
      </main>
    </div>
  </section>

  <!-- Modals & Overlays -->
  <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true">
      <header class="sheet-header">
        <h2 id="sheetTitle">对话</h2>
        <button class="icon-button" id="sheetClose" aria-label="关闭">×</button>
      </header>
      <div class="sheet-content" id="sheetContent"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <!-- JS Logic -->
  <script>
    const state = {
      token: localStorage.getItem('nas-codex-token') || '',
      tasks: new Map(),
      activeTaskId: null,
      history: [],
      favorites: [],
      language: 'zh-CN',
      provider: null,
      source: null,
      typewriters: new Map(),
    };

    const $ = (selector) => document.querySelector(selector);
    const loginScreen = $('#loginScreen');
    const app = $('#app');
    const timeline = $('#timeline');
    const timelineWrap = $('#timelineWrap');
    const promptInput = $('#promptInput');
    const sidebar = $('#sidebar');
    const sheetBackdrop = $('#sheetBackdrop');
    const sheetTitle = $('#sheetTitle');
    const sheetContent = $('#sheetContent');

    function showToast(message) {
      const toast = $('#toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function setConnection(text, ok = true) {
      $('#toolbarSubtitle').textContent = text;
      $('#connectionDot').style.background = ok ? 'var(--success)' : 'var(--danger)';
    }

    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const response = await fetch(path, { ...options, headers });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (response.status === 401) showLogin();
        throw new Error(payload.error || `请求失败：${response.status}`);
      }
      return payload;
    }

    function showLogin() {
      state.token = '';
      localStorage.removeItem('nas-codex-token');
      app.classList.add('hidden');
      loginScreen.classList.remove('hidden');
      if (state.source) state.source.close();
      setTimeout(() => $('#password').focus(), 50);
    }

    function showApp() {
      loginScreen.classList.add('hidden');
      app.classList.remove('hidden');
    }

    $('#loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = $('#loginButton');
      const error = $('#loginError');
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: $('#password').value }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || '登录失败');
        state.token = payload.token;
        localStorage.setItem('nas-codex-token', state.token);
        await bootstrap();
      } catch (loginError) { error.textContent = loginError.message; }
      finally { button.disabled = false; }
    });

    async function bootstrap() {
      const payload = await api('/api/bootstrap');
      state.history = payload.history || [];
      state.favorites = payload.favorites || [];
      state.language = payload.language || 'zh-CN';
      state.provider = payload.provider || null;
      state.tasks = new Map((payload.tasks || []).map((task) => [task.id, { ...task, events: [] }]));
      showApp(); renderTasks(); setConnection('已连接', true);
    }

    function dateLabel(timestamp) {
      const date = new Date(timestamp || Date.now());
      if (Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(date);
    }

    function renderTasks() {
      const taskList = $('#taskList');
      const tasks = [...state.tasks.values()].sort((a, b) => b.updatedAt - a.updatedAt);
      if (!tasks.length) {
        taskList.innerHTML = '<div style="padding:10px 12px; font-size:12px; color:var(--secondary)">暂无运行任务</div>';
        return;
      }
      taskList.innerHTML = '';
      tasks.forEach((task) => {
        const button = document.createElement('button');
        button.className = `task-button ${task.id === state.activeTaskId ? 'active' : ''}`;
        button.innerHTML = `<strong></strong><small></small>`;
        button.querySelector('strong').textContent = task.title || '未命名任务';
        button.querySelector('small').textContent = task.status === 'running' ? '正在运行' : task.status === 'error' ? '已出错' : '已完成';
        button.addEventListener('click', () => selectTask(task.id));
        taskList.appendChild(button);
      });
    }

    function eventNode(event) {
      const node = document.createElement('article');
      node.className = 'event';
      node.dataset.eventId = event.id;

      if (event.type === 'message') {
        node.className = `event message ${event.role || 'assistant'}`;
        if (event.role === 'assistant') {
          node.dataset.fullText = event.text || '';
          const content = document.createElement('div');
          content.className = 'rich-text';
          node.appendChild(content);
          animateText(content, event.text || '');
        } else { node.textContent = event.text || ''; }
        return node;
      }

      if (event.type === 'status') {
        node.className = `event status-pill ${event.state === 'thinking' ? 'thinking' : ''}`;
        node.textContent = event.text || event.state || '';
        return node;
      }

      if (event.type === 'tool') {
        node.className = 'event tool-card';
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const command = document.createElement('span'); command.className = 'tool-command'; command.textContent = event.command || '命令执行';
        const meta = document.createElement('span'); meta.className = 'tool-meta'; meta.textContent = event.exitCode === null || event.exitCode === undefined ? '运行中' : `退出 ${event.exitCode}`;
        summary.append(command, meta);
        const output = document.createElement('pre'); output.className = 'tool-output'; output.textContent = event.output || '等待输出…';
        details.append(summary, output); node.appendChild(details);
        return node;
      }

      node.className = `event notice ${event.level || ''}`;
      node.textContent = event.text || event.message || '事件';
      return node;
    }

    function renderRichText(container, text) {
      const source = text || '';
      if (!window.marked || !window.DOMPurify) { container.textContent = source; return; }
      marked.setOptions({ gfm: true, breaks: true });
      const unsafeHtml = marked.parse(source);
      container.innerHTML = DOMPurify.sanitize(unsafeHtml, { USE_PROFILES: { html: true } });
      if (window.renderMathInElement) {
        renderMathInElement(container, {
          throwOnError: false, strict: false,
          delimiters: [
            { left: '$$', right: '$$', display: true }, { left: '\[', right: '\]', display: true },
            { left: '\(', right: '\)', display: false }, { left: '$', right: '$', display: false },
          ],
        });
      }
    }

    function animateText(node, text) {
      let index = 0; renderRichText(node, '');
      function tick() {
        index = Math.min(text.length, index + Math.max(1, Math.round(text.length / 90)));
        renderRichText(node, text.slice(0, index));
        if (index < text.length) { requestAnimationFrame(tick); } else { node.classList.add('done'); }
      }
      requestAnimationFrame(tick);
    }

    function renderTimeline() {
      const task = state.tasks.get(state.activeTaskId);
      timeline.innerHTML = '';
      if (!task) {
        timeline.innerHTML = `<section class="empty-state"><h2>今天想让 Codex 做什么？</h2><p>通过私有 API 启动任务，实时查看执行过程。</p></section>`;
        return;
      }
      const fragment = document.createDocumentFragment();
      for (const event of task.events || []) fragment.appendChild(eventNode(event));
      timeline.appendChild(fragment);
      requestAnimationFrame(() => { timelineWrap.scrollTop = timelineWrap.scrollHeight; });
    }

    function appendEvent(task, event) {
      if (!task.events) task.events = [];
      if (task.events.some((item) => item.id === event.id)) return;
      task.events.push(event);
      if (task.id !== state.activeTaskId) return;
      timeline.appendChild(eventNode(event));
      requestAnimationFrame(() => { timelineWrap.scrollTop = timelineWrap.scrollHeight; });
    }

    function openStream(taskId) {
      if (state.source) state.source.close();
      const task = state.tasks.get(taskId);
      if (task) { task.events = []; renderTimeline(); }
      state.source = new EventSource(`/api/tasks/${encodeURIComponent(taskId)}/events?token=${encodeURIComponent(state.token)}`);
      state.source.addEventListener('ready', (event) => {
        const payload = JSON.parse(event.data);
        if (payload.task) {
          state.tasks.set(taskId, { ...state.tasks.get(taskId), ...payload.task, events: state.tasks.get(taskId)?.events || [] });
          renderTasks();
        }
      });
      state.source.addEventListener('message', (event) => {
        const payload = JSON.parse(event.data);
        const current = state.tasks.get(taskId);
        if (!current) return;
        if (payload.type === 'session') current.threadId = payload.threadId;
        if (payload.type === 'status') {
          current.status = payload.state === 'complete' ? 'idle' : 'running';
          setConnection(payload.text || '运行中', payload.state !== 'error');
        }
        current.updatedAt = payload.at;
        appendEvent(current, payload); renderTasks();
      });
      state.source.onerror = () => { setConnection('连接中断', false); };
    }

    function selectTask(taskId) {
      state.activeTaskId = taskId; const task = state.tasks.get(taskId);
      if (task) {
        $('#toolbarTitle').textContent = task.title || 'NAS Codex';
        setConnection(task.status === 'running' ? '正在运行' : '已连接', task.status !== 'error');
        renderTimeline(); openStream(taskId);
      }
      sidebar.classList.remove('open'); renderTasks();
    }

    async function startTask(prompt, resumeId = null, cwd = '/app') {
      try {
        const payload = await api('/api/tasks', { method: 'POST', body: JSON.stringify({ prompt, resumeId, cwd }) });
        state.tasks.set(payload.task.id, { ...payload.task, events: [] });
        state.activeTaskId = payload.task.id;
        renderTasks(); $('#toolbarTitle').textContent = payload.task.title;
        renderTimeline(); openStream(payload.task.id); closeSheet(); sidebar.classList.remove('open');
      } catch (error) { showToast(error.message); }
    }

    $('#composer').addEventListener('submit', async (event) => {
      event.preventDefault(); const prompt = promptInput.value.trim();
      if (!prompt) return;
      promptInput.value = ''; promptInput.style.height = 'auto';
      const task = state.tasks.get(state.activeTaskId);
      if (!task) { await startTask(prompt); return; }
      try { await api(`/api/tasks/${encodeURIComponent(task.id)}/input`, { method: 'POST', body: JSON.stringify({ prompt }) }); }
      catch (error) { showToast(error.message); }
    });

    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto'; promptInput.style.height = `${Math.min(promptInput.scrollHeight, 150)}px`;
    });

    function openSheet(title, content) {
      sheetTitle.textContent = title; sheetContent.replaceChildren(content); sheetBackdrop.classList.add('open');
    }

    function closeSheet() { sheetBackdrop.classList.remove('open'); }
    $('#sheetClose').addEventListener('click', closeSheet);
    sheetBackdrop.addEventListener('click', (e) => { if (e.target === sheetBackdrop) closeSheet(); });

    function makeButton(label, className = 'chip') {
      const button = document.createElement('button'); button.className = className; button.textContent = label; return button;
    }

    function favoriteFor(threadId) { return state.favorites.find((f) => f.threadId === threadId); }
    async function toggleFavorite(threadId, title, action) {
      const payload = await api('/api/favorites', { method: 'POST', body: JSON.stringify({ threadId, title, action }) });
      state.favorites = payload.favorites;
    }

    async function toggleArchive(thread) {
      const action = thread.archived ? 'unarchive' : 'archive';
      await api(`/api/threads/${encodeURIComponent(thread.threadId)}/${action}`, { method: 'POST' });
      thread.archived = !thread.archived; renderHistorySheet(); showToast(thread.archived ? '已归档' : '已取消归档');
    }

    function confirmDeleteThread(thread) {
      const wrapper = document.createElement('div'); wrapper.className = 'history-list';
      wrapper.innerHTML = `<p style="margin-bottom:12px;">将永久删除“${thread.title}”。此操作不可撤销。</p>
        <div class="field"><label>输入 DELETE 确认</label><input id="deleteConfirm" autocomplete="off"></div>
        <div class="history-actions" style="margin-top:16px;"></div>`;
      const input = wrapper.querySelector('#deleteConfirm'); const actions = wrapper.querySelector('.history-actions');
      const cancel = makeButton('取消', 'button ghost'); const remove = makeButton('永久删除', 'button danger'); remove.disabled = true;
      input.addEventListener('input', () => remove.disabled = input.value.trim() !== 'DELETE');
      cancel.addEventListener('click', closeSheet);
      remove.addEventListener('click', async () => {
        if (input.value.trim() !== 'DELETE') return;
        remove.disabled = true;
        try {
          await api(`/api/threads/${encodeURIComponent(thread.threadId)}/delete`, { method: 'POST', body: JSON.stringify({ confirm: 'DELETE' }) });
          state.history = state.history.filter((i) => i.threadId !== thread.threadId); state.favorites = state.favorites.filter((i) => i.threadId !== thread.threadId);
          renderHistorySheet(); showToast('对话已永久删除');
        } catch (error) { remove.disabled = false; showToast(error.message); }
      });
      actions.append(cancel, remove); openSheet('删除对话', wrapper); setTimeout(() => input.focus(), 120);
    }

    function renderHistory() {
      const wrapper = document.createElement('div'); const list = document.createElement('div'); list.className = 'history-list';
      const sorted = [...state.history].sort((a, b) => {
        const aFav = favoriteFor(a.threadId); const bFav = favoriteFor(b.threadId);
        return Number(Boolean(bFav?.pinned)) - Number(Boolean(aFav?.pinned));
      });
      sorted.forEach((thread) => {
        const favorite = favoriteFor(thread.threadId); const row = document.createElement('div'); row.className = 'history-row';
        row.innerHTML = `<div class="history-main"><div class="history-title">${favorite?.pinned ? '📌 ' : ''}${favorite ? '⭐ ' : ''}${thread.title}</div><div class="history-meta">${dateLabel(thread.updatedAt)}${thread.archived ? ' · 已归档' : ''}</div></div><div class="history-actions"></div>`;
        const actions = row.querySelector('.history-actions');
        const resume = makeButton('恢复'); resume.addEventListener('click', () => openNewTaskSheet(thread.threadId, thread.title, thread.cwd));
        const favBtn = makeButton(favorite ? '取消收藏' : '收藏', `chip ${favorite ? 'active' : ''}`); favBtn.addEventListener('click', async () => { await toggleFavorite(thread.threadId, thread.title, favorite ? 'remove' : 'add'); renderHistorySheet(); showToast(favorite ? '已取消收藏' : '已收藏'); });
        const pinBtn = makeButton(favorite?.pinned ? '取消置顶' : '置顶', `chip ${favorite?.pinned ? 'active' : ''}`); pinBtn.addEventListener('click', async () => { await toggleFavorite(thread.threadId, thread.title, favorite?.pinned ? 'unpin' : 'pin'); renderHistorySheet(); showToast(favorite?.pinned ? '已取消置顶' : '已置顶'); });
        const arcBtn = makeButton(thread.archived ? '取消归档' : '归档'); arcBtn.addEventListener('click', async () => await toggleArchive(thread));
        const delBtn = makeButton('删除', 'chip danger'); delBtn.addEventListener('click', () => confirmDeleteThread(thread));
        actions.append(resume, favBtn, pinBtn, arcBtn, delBtn); list.appendChild(row);
      });
      if (!sorted.length) list.innerHTML = '<div class="history-meta">没有历史对话。</div>';
      wrapper.appendChild(list); return wrapper;
    }
    function renderHistorySheet() { openSheet('历史对话', renderHistory()); }

    function renderFavoritesSheet() {
      const wrapper = document.createElement('div'); const favorites = state.favorites.map((f) => ({ ...f, thread: state.history.find((t) => t.threadId === f.threadId) })).filter((i) => i.thread);
      if (!favorites.length) { wrapper.innerHTML = '<div class="history-meta">还没有收藏的对话。</div>'; openSheet('收藏与置顶', wrapper); return; }
      const list = document.createElement('div'); list.className = 'history-list';
      favorites.sort((a, b) => Number(b.pinned) - Number(a.pinned)).forEach(({ pinned, thread }) => {
        const row = document.createElement('div'); row.className = 'history-row';
        row.innerHTML = `<div class="history-main"><div class="history-title">${pinned ? '📌 ' : ''}${thread.title}</div><div class="history-meta">${dateLabel(thread.updatedAt)}</div></div><div class="history-actions"></div>`;
        const actions = row.querySelector('.history-actions');
        const resume = makeButton('恢复'); resume.addEventListener('click', () => openNewTaskSheet(thread.threadId, thread.title, thread.cwd));
        const remove = makeButton('移除', 'chip danger'); remove.addEventListener('click', async () => { await toggleFavorite(thread.threadId, thread.title, 'remove'); renderFavoritesSheet(); showToast('已移除收藏'); });
        actions.append(resume, remove); list.appendChild(row);
      });
      wrapper.appendChild(list); openSheet('收藏与置顶', wrapper);
    }

    function openNewTaskSheet(resumeId = null, title = '', cwd = '/app') {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = `<form class="field"><div class="history-meta" style="margin-bottom:16px;">${resumeId ? '继续已有对话' : '新的 Codex 任务'}</div><div class="field"><label>任务内容</label><textarea id="taskPrompt" placeholder="描述要完成的工作…"></textarea></div><div class="field"><label>工作目录</label><input id="taskCwd" value="${cwd || '/app'}"></div><button class="button primary wide" style="margin-top:12px;" type="submit">开始</button></form>`;
      wrapper.querySelector('form').addEventListener('submit', async (e) => { e.preventDefault(); const prompt = wrapper.querySelector('#taskPrompt').value.trim(); const workdir = wrapper.querySelector('#taskCwd').value.trim() || '/app'; if (!prompt) return; await startTask(prompt, resumeId, workdir); });
      openSheet(title || (resumeId ? '继续对话' : '新建任务'), wrapper); setTimeout(() => wrapper.querySelector('#taskPrompt').focus(), 120);
    }

    function openProviderSheet() {
      const provider = state.provider || {};
      const form = document.createElement('form');
      form.className = 'field';

      const intro = document.createElement('div');
      intro.className = 'history-meta';
      intro.style.marginBottom = '16px';
      intro.textContent = provider.hasApiKey
        ? `当前已保存 API Key，尾号 ${provider.apiKeySuffix || '****'}。留空不会覆盖。`
        : '尚未保存 API Key。';

      const makeField = (labelText, input) => {
        const field = document.createElement('div');
        field.className = 'field';
        const label = document.createElement('label');
        label.textContent = labelText;
        field.append(label, input);
        return field;
      };

      const preset = document.createElement('select');
      [
        ['custom', '自定义 OpenAI 兼容接口'],
        ['deepseek', 'DeepSeek 官方 API'],
      ].forEach(([value, labelText]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = labelText;
        preset.appendChild(option);
      });
      preset.value = String(provider.baseUrl || '').includes('api.deepseek.com') ? 'deepseek' : 'custom';

      const baseUrl = document.createElement('input');
      baseUrl.type = 'url';
      baseUrl.placeholder = 'https://api.deepseek.com';
      baseUrl.value = provider.baseUrl || '';
      baseUrl.autocomplete = 'url';

      const model = document.createElement('input');
      model.type = 'text';
      model.placeholder = 'deepseek-flash';
      model.value = provider.model || '';
      model.autocomplete = 'off';
      model.setAttribute('list', 'providerModelOptions');

      const modelOptions = document.createElement('datalist');
      modelOptions.id = 'providerModelOptions';

      const apiKey = document.createElement('input');
      apiKey.type = 'password';
      apiKey.placeholder = provider.hasApiKey ? '留空保留现有 Key' : '输入 API Key';
      apiKey.autocomplete = 'new-password';

      const wireApi = document.createElement('select');
      [['responses', 'Responses API'], ['chat', 'Chat Completions']].forEach(([value, labelText]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = labelText;
        option.selected = (provider.wireApi || 'responses') === value;
        wireApi.appendChild(option);
      });

      const status = document.createElement('div');
      status.className = 'history-meta';
      status.style.minHeight = '20px';

      const actions = document.createElement('div');
      actions.className = 'history-actions';
      actions.style.marginTop = '16px';

      const save = makeButton('保存设置', 'button primary');
      save.type = 'submit';
      const test = makeButton('保存并测试', 'button ghost');
      test.type = 'button';
      const discover = makeButton('读取模型列表', 'button ghost');
      discover.type = 'button';
      const cancel = makeButton('取消', 'button ghost');
      cancel.type = 'button';
      cancel.addEventListener('click', closeSheet);
      actions.append(save, test, discover, cancel);

      preset.addEventListener('change', () => {
        if (preset.value === 'deepseek') {
          baseUrl.value = 'https://api.deepseek.com';
          model.value = 'deepseek-flash';
          wireApi.value = 'responses';
        }
      });

      const saveProvider = async () => {
        save.disabled = true;
        test.disabled = true;
        status.textContent = '正在保存…';
        try {
          const payload = await api('/api/provider', {
            method: 'POST',
            body: JSON.stringify({
              baseUrl: baseUrl.value.trim(),
              model: model.value.trim(),
              apiKey: apiKey.value,
              wireApi: wireApi.value,
            }),
          });
          state.provider = payload.provider;
          apiKey.value = '';
          apiKey.placeholder = payload.provider.hasApiKey ? '留空保留现有 Key' : '输入 API Key';
          intro.textContent = payload.provider.hasApiKey
            ? `当前已保存 API Key，尾号 ${payload.provider.apiKeySuffix || '****'}。留空不会覆盖。`
            : '尚未保存 API Key。';
          status.textContent = '设置已保存。';
          return payload.provider;
        } catch (error) {
          status.textContent = error.message;
          throw error;
        } finally {
          save.disabled = false;
          test.disabled = false;
        }
      };

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await saveProvider();
          showToast('API 设置已保存');
        } catch {}
      });

      test.addEventListener('click', async () => {
        try {
          await saveProvider();
          status.textContent = '正在测试连接…';
          const result = await api('/api/provider/test', { method: 'POST' });
          status.textContent = result.ok
            ? `连接成功，发现 ${result.models?.length || 0} 个模型（HTTP ${result.status}）`
            : `连接返回 HTTP ${result.status}`;
        } catch (error) {
          status.textContent = `连接失败：${error.message}`;
        }
      });

      discover.addEventListener('click', async () => {
        discover.disabled = true;
        status.textContent = '正在读取模型列表…';
        try {
          const result = await api('/api/provider/models', {
            method: 'POST',
            body: JSON.stringify({
              baseUrl: baseUrl.value.trim(),
              apiKey: apiKey.value,
            }),
          });
          modelOptions.replaceChildren();
          for (const id of result.models || []) {
            const option = document.createElement('option');
            option.value = id;
            modelOptions.appendChild(option);
          }
          if (!model.value && result.models?.length) model.value = result.models[0];
          status.textContent = `读取成功，共 ${result.models?.length || 0} 个模型`;
        } catch (error) {
          status.textContent = `读取失败：${error.message}`;
        } finally {
          discover.disabled = false;
        }
      });

      form.append(
        intro,
        makeField('快速预设', preset),
        makeField('API Base URL', baseUrl),
        makeField('模型名称', model),
        modelOptions,
        makeField('API Key', apiKey),
        makeField('请求协议', wireApi),
        status,
        actions
      );
      openSheet('API 与模型设置', form);
      setTimeout(() => baseUrl.focus(), 120);
    }

    function openLanguageSheet() {
      const wrapper = document.createElement('div'); wrapper.className = 'history-list';
      [['zh-CN', '简体中文'], ['zh-HK', '香港繁体'], ['en', 'English']].forEach(([code, label]) => {
        const btn = makeButton(`${state.language === code ? '✓ ' : ''}${label}`, `chip ${state.language === code ? 'active' : ''}`);
        btn.style.padding = '12px 16px'; btn.style.fontSize = '14px'; btn.style.justifyContent = 'flex-start';
        btn.addEventListener('click', async () => { const payload = await api('/api/language', { method: 'POST', body: JSON.stringify({ locale: code }) }); state.language = payload.language; closeSheet(); showToast(`已切换至：${label}`); });
        wrapper.appendChild(btn);
      });
      openSheet('回答语言', wrapper);
    }

    $('#newTaskButton').addEventListener('click', () => openNewTaskSheet());
    $('#resumeButton').addEventListener('click', () => { const recent = state.history.find((t) => !t.archived); if (!recent) { showToast('没有可恢复的对话'); return; } openNewTaskSheet(recent.threadId, recent.title, recent.cwd); });
    $('#historyButton').addEventListener('click', renderHistorySheet); $('#favoritesButton').addEventListener('click', renderFavoritesSheet);
    $('#apiButton').addEventListener('click', openProviderSheet);
    $('#languageButton').addEventListener('click', openLanguageSheet); $('#menuButton').addEventListener('click', () => sidebar.classList.toggle('open')); $('#logoutButton').addEventListener('click', showLogin);

    (async function init() { if (!state.token) { showLogin(); return; } try { await api('/api/auth'); await bootstrap(); } catch { showLogin(); } })();
  </script>
</body>
</html>
